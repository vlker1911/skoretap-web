<style>

  .filtr button[aria-pressed="true"] { background: var(--micek); color: #14141A; border-color: var(--micek); }

  .vysledek.jine { background: var(--cara); color: var(--text); }
  .tym { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .tym + .tym { border-top: 1px solid var(--cara); }
  .tym .p { width: 6px; height: 26px; border-radius: 3px; flex: none; }
  .tym .j { flex: 1; font-weight: 700; overflow-wrap: anywhere; }

  .tym .c { display: flex; gap: 6px; font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.45); }

  .poznamkaPrehled { color: var(--tlumeny); font-size: 13px; margin-top: 8px; }
</style>

  // E-mail: odkaz bez hesla. Kdo účet nemá, tím ho rovnou založí.
  async function poslatOdkaz(email) {
    var odp = await fetch(SERVER + '/auth/v1/otp?redirect_to=' + encodeURIComponent(NAVRAT), {
      method: 'POST', headers: { apikey: KLIC, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, create_user: true })
    });
    return odp.ok;
  }

  // Loga služeb jako jednoduché značky, bez cizích souborů.
  var LOGA = {
    google: '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.2-4.8 3.2-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1-3.7 1-2.8 0-5.2-1.9-6.1-4.5H2.2v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.9 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.2a11 11 0 0 0 0 9.8l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3 .6 4.1 1.6l3.1-3.1A11 11 0 0 0 2.2 7.1l3.7 2.8C6.8 7.3 9.2 5.4 12 5.4z"/></svg>',
    apple: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.1zM13.9 5c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>',
    facebook: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1877F2"/><path fill="#fff" d="M15.1 15.5l.5-3.1h-3v-2c0-.9.4-1.7 1.8-1.7h1.4V6s-1.3-.2-2.5-.2c-2.5 0-4.2 1.5-4.2 4.3v2.3H6.4v3.1h2.7V23a11 11 0 0 0 3.4 0v-7.5h2.6z"/></svg>'
  };

  // Které přihlášení je na serveru zapnuté. Tlačítko se ukáže samo, jakmile
  // se služba v Supabase zapne — stránka se kvůli tomu nemusí měnit.
  var SLUZBY = ['google', 'apple', 'facebook'];
  async function zapnuteSluzby() {
    try {
      var odp = await fetch(SERVER + '/auth/v1/settings', { headers: { apikey: KLIC } });
      return (await odp.json()).external || {};
    } catch (e) {
      return { google: true };
    }
  }

  async function platnyPristup() {
    var r = relace();
    if (!r) return null;
    if (r.platiDo - 60000 > Date.now()) return r.pristup;
    var odp = await fetch(SERVER + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: { apikey: KLIC, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: r.obnova })
    });
    if (!odp.ok) { ulozRelaci(null); return null; }
    var d = await odp.json();
    ulozRelaci({ pristup: d.access_token, obnova: d.refresh_token, platiDo: Date.now() + (d.expires_in || 3600) * 1000 });
    return d.access_token;
  }

  async function cti(cesta, pristup) {
    var odp = await fetch(SERVER + cesta, { headers: { apikey: KLIC, Authorization: 'Bearer ' + pristup } });
    if (odp.status === 401) { ulozRelaci(null); throw new Error('odhlasen'); }
    if (!odp.ok) throw new Error('chyba');
    return odp.json();
  }

  // Smaže zálohu rozehraného zápasu (a jeho veřejnou stránku, kdyby byla).
  // Databáze dovolí smazat jen vlastní řádek (RLS).
  async function smazZapas(id) {
    var pristup = await platnyPristup();
    if (!pristup) return false;
    var hlavicky = { apikey: KLIC, Authorization: 'Bearer ' + pristup, 'Content-Type': 'application/json', Prefer: 'return=minimal' };
    var odp = await fetch(SERVER + '/rest/v1/zapasy?id=eq.' + encodeURIComponent(id) + '&dohrano=eq.false', { method: 'DELETE', headers: hlavicky });
    if (!odp.ok) return false;
    await fetch(SERVER + '/rest/v1/rpc/zrus_zverejneni', { method: 'POST', headers: hlavicky, body: JSON.stringify({ p_zapas: id }) }).catch(function () {});
    return true;
  }

  document.getElementById('odhlasit').onclick = async function () {
    var r = relace();
    if (r) fetch(SERVER + '/auth/v1/logout', { method: 'POST', headers: { apikey: KLIC, Authorization: 'Bearer ' + r.pristup } }).catch(function () {});
    ulozRelaci(null);
    neprihlasen();
  };

  async function neprihlasen() {
    document.getElementById('odhlasit').hidden = true;
    obsah.textContent = '';
    if (chybaPrihlaseni) obsah.appendChild(el('p', 'chyba', T.prihlaseniChyba + chybaPrihlaseni));
    obsah.appendChild(el('p', '', T.popis));
    var zapnute = await zapnuteSluzby();
    var box = el('div', 'prihlaseni');
    SLUZBY.filter(function (s) { return zapnute[s]; }).forEach(function (s) {
      var b = el('button', 'sluzba');
      b.innerHTML = LOGA[s]; // vlastní značka, ne cizí data
      b.appendChild(document.createTextNode(T[s]));
      b.onclick = function () { prihlasit(s); };
      box.appendChild(b);
    });
    if (zapnute.email) {
      if (box.children.length) box.appendChild(el('div', 'nebo', T.nebo));
      var f = el('form');
      f.style.display = 'contents';
      var vstup = el('input');
      vstup.type = 'email'; vstup.required = true; vstup.autocomplete = 'email'; vstup.placeholder = T.email;
      vstup.setAttribute('aria-label', T.email);
      var odeslat = el('button', 'hlavni', T.poslatOdkaz);
      odeslat.type = 'submit';
      var zprava = el('p', 'chyba');
      f.appendChild(vstup); f.appendChild(odeslat); f.appendChild(zprava);
      f.onsubmit = async function (e) {
        e.preventDefault();
        odeslat.disabled = true;
        zprava.textContent = '';
        var email = vstup.value.trim();
        if (await poslatOdkaz(email).catch(function () { return false; })) {
          box.textContent = '';
          box.appendChild(el('div', 'odeslano', T.odeslano.replace('{email}', email)));
        } else {
          zprava.textContent = T.emailChyba;
          odeslat.disabled = false;
        }
      };
      box.appendChild(f);
    }
    if (!box.children.length) box.appendChild(el('p', 'chyba', T.zadnaSluzba));
    obsah.appendChild(box);
  }

  // ------------------------------------------------ účet a zápasy
  async function nacti() {
    var pristup = await platnyPristup();
    if (!pristup) { neprihlasen(); return; }
    document.getElementById('odhlasit').hidden = false;
    obsah.textContent = '';
    try {
      var vysledky = await Promise.all([
        cti('/auth/v1/user', pristup),
        cti('/rest/v1/profily?select=jmeno,prijmeni,kod', pristup),
        cti('/rest/v1/zapasy?select=id,zalozen,dohrano,souhrn,zaznam&order=zalozen.desc&limit=100', pristup),
        cti('/rest/v1/zverejnene?select=id,zapas', pristup)
      ]);
      await kresli(vysledky[0], vysledky[1][0] || {}, vysledky[2], vysledky[3]);
    } catch (e) {
      if (e.message === 'odhlasen') neprihlasen(); else obsah.appendChild(el('p', 'chyba', T.chyba));
    }
  }

  var BARVY_TYMU = { MODRA: '#2F6FD0', CERVENA: '#E30613', ZELENA: '#1E9A4C', ZLUTA: '#E0B400', BILA: '#E9E9EE', CERNA: '#6A6A7A' };
  var TYMY = en ? { MODRA: 'Blue', CERVENA: 'Red', ZELENA: 'Green', ZLUTA: 'Yellow', BILA: 'White', CERNA: 'Black' }
    : { MODRA: 'Modří', CERVENA: 'Červení', ZELENA: 'Zelení', ZLUTA: 'Žlutí', BILA: 'Bílí', CERNA: 'Černí' };
  TYMY = JZ.preloz(TYMY, slovnik);
  function cas(minut) { var h = Math.floor(minut / 60); return h ? h + ' h ' + (minut % 60) + ' min' : minut + ' min'; }

  async function kresli(uzivatel, profil, zapasy, zverejnene) {
    document.querySelector('main').classList.add('siroky');
    if (!jadro) jadro = (await import('./app/jadro/skoretap-jadro.mjs')).Jadro.getInstance();

    // Profil: iniciály, jméno, e-mail a kód hráče.
    var cele = [profil.jmeno, profil.prijmeni].filter(Boolean).join(' ') || (uzivatel.user_metadata && uzivatel.user_metadata.full_name) || uzivatel.email || '';
    // Křestní jméno pro pozdrav ve webové aplikaci (app/). Jen v tomhle
    // prohlížeči; při odhlášení se smaže spolu s přihlášením.
    try { localStorage.setItem('skoretap.jmeno', profil.jmeno || (cele.indexOf('@') < 0 ? cele.split(/\s+/)[0] : '')); } catch (e) { /* bez paměti */ }
    var hrdina = el('div', 'hrdina');
    hrdina.appendChild(el('div', 'avatar', cele.split(/\s+/).filter(Boolean).slice(0, 2).map(function (s) { return s[0]; }).join('').toUpperCase() || 'S'));
    var kdo = el('div', 'kdo');
    kdo.appendChild(el('div', 'jmeno', cele));
    kdo.appendChild(el('div', 'pod', uzivatel.email || ''));
    if (profil.kod) kdo.appendChild(el('span', 'kodHrace', T.kod + ' ' + profil.kod));
    hrdina.appendChild(kdo);
    var novy = el('a', 'novy', T.novy);
    novy.href = '/app/';
    hrdina.appendChild(novy);
    obsah.appendChild(hrdina);

    // Přehled: tentýž výpočet jako v aplikaci (Prehled).
    var souhrny = zapasy.map(function (z) { var s = jadro.souhrnZapasu(z.zaznam || ''); return s ? JSON.parse(s) : null; });
    var pr = JSON.parse(jadro.prehled(JSON.stringify(zapasy.map(function (z) { return z.zaznam || ''; }))));
    var minutCelkem = souhrny.reduce(function (a, s) { return a + (s ? s.minut : 0); }, 0);
    obsah.appendChild(el('h2', '', T.prehled));
    var cisla = el('div', 'cisla');
    function cislo(hodnota, popis, procenta, micek) {
      var c = el('div', 'cislo');
      c.appendChild(el('b', micek ? 'micek' : '', String(hodnota)));
      c.appendChild(el('span', '', popis));
      if (procenta != null) { var p = el('div', 'pruh'); var i = el('i'); i.style.width = procenta + '%'; p.appendChild(i); c.appendChild(p); }
      cisla.appendChild(c);
    }
    cislo(zapasy.length, T.cZapasu);
    if (pr.zapasu > 0) cislo(pr.vyhry + ' / ' + (pr.vyhry + pr.prohry), T.cVyhry + (pr.vyhryProcenta != null ? ' · ' + pr.vyhryProcenta + ' %' : ''), pr.vyhryProcenta, true);
    cislo(cas(minutCelkem), T.cCas);
    // Tohle jde spočítat vždycky, i bez „Tohle jsem já".
    var platne = souhrny.filter(Boolean);
    var setu = platne.reduce(function (a, s) { return a + s.sety.length; }, 0);
    var gemu = platne.reduce(function (a, s) {
      return a + s.sety.reduce(function (b, st) { return b + st[0] + st[1]; }, 0) + s.tymy[0].gemy + s.tymy[1].gemy;
    }, 0);
    var nejdelsi = platne.reduce(function (a, s) { return Math.max(a, s.minut || 0); }, 0);
    if (setu) cislo(setu, T.cSetu);
    if (gemu) cislo(gemu, T.cGemu);
    if (nejdelsi) cislo(cas(nejdelsi), T.cNejdelsi);
    if (pr.podaniProcenta != null) cislo(pr.podaniProcenta + ' %', T.cPodani, pr.podaniProcenta);
    if (pr.returnProcenta != null) cislo(pr.returnProcenta + ' %', T.cReturn, pr.returnProcenta);
    if (pr.gemuPodano > 0) cislo(pr.gemuUhajeno + ' / ' + pr.gemuPodano, T.cGemy, Math.round(pr.gemuUhajeno * 100 / pr.gemuPodano));
    if (pr.kalorie != null) cislo(pr.kalorie, T.cKalorie);
    if (pr.kroky != null) cislo(pr.kroky, T.cKroky);
    if (pr.tepPrumer != null) cislo(pr.tepPrumer, T.cTep);
    obsah.appendChild(cisla);
    if (pr.zapasu < zapasy.length) obsah.appendChild(el('p', 'poznamkaPrehled', T.bezJa));

    // Zápasy jako karty s výsledkovou tabulkou.
    var nad = el('div', 'nadZapasy');
    nad.appendChild(el('h2', '', T.zapasy));
    var filtr = el('div', 'filtr');
    nad.appendChild(filtr);
    obsah.appendChild(nad);
    var mrizka = el('div', 'mrizka');
    obsah.appendChild(mrizka);
    if (!zapasy.length) { mrizka.appendChild(el('p', '', T.zadne)); return; }
    var stranky = {};
    zverejnene.forEach(function (z) { stranky[z.zapas] = z.id; });

    var vybrany = 'vse';
    function kresliFiltr() {
      filtr.textContent = '';
      [['vse', T.vse], ['dohrane', T.jenDohrane], ['rozehrane', T.jenRozehrane]].forEach(function (f) {
        var b = el('button', '', f[1]);
        b.setAttribute('aria-pressed', String(f[0] === vybrany));
        b.onclick = function () { vybrany = f[0]; kresliFiltr(); kresliKarty(); };
        filtr.appendChild(b);
      });
    }
    function kresliKarty() {
      mrizka.textContent = '';
      zapasy.forEach(function (z, idx) {
        if (vybrany === 'dohrane' && !z.dohrano) return;
        if (vybrany === 'rozehrane' && z.dohrano) return;
        mrizka.appendChild(karta(z, souhrny[idx]));
      });
    }
    function karta(z, s) {
      var k = el('div', 'karta');
      var vrch = el('div', 'vrch');
      vrch.appendChild(el('span', 'misto', new Date(z.zalozen).toLocaleString(JZ.mistni(jaz), { day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + (s && s.minut ? ' · ' + cas(s.minut) : '')));
      var stitek = !z.dohrano ? [T.rozehrano, 'jine']
        : s && s.ja != null && s.vitez != null ? (s.vitez === s.ja ? [T.vyhra, 'vyhra'] : [T.prohra, 'prohra'])
        : [T.dohrano, 'jine'];
      vrch.appendChild(el('span', 'vysledek ' + stitek[1], stitek[0].toUpperCase()));
      k.appendChild(vrch);
      [0, 1].forEach(function (i) {
        var t = s ? s.tymy[i] : null;
        var r = el('div', 'tym');
        var p = el('span', 'p'); p.style.background = t ? BARVY_TYMU[t.barva] : '#888';
        r.appendChild(p);
        var jm = t ? (t.hraci.length ? t.hraci.join(' / ') : TYMY[t.barva]) : ((z.souhrn || {})[i ? 'hraci_b' : 'hraci_a'] || '?');
        r.appendChild(el('span', 'j' + (s && s.ja === i ? ' ja' : ''), jm));
        var c = el('span', 'c');
        if (s) {
          s.sety.forEach(function (st) { c.appendChild(el('span', st[i] > st[1 - i] ? 'v' : '', String(st[i]))); });
          if (s.format === 'AMERICANO') c.appendChild(el('span', 'v', t.body));
          else if (s.tymy[0].gemy + s.tymy[1].gemy > 0 || !s.konec) c.appendChild(el('span', 'g', String(t.gemy)));
        }
        r.appendChild(c);
        k.appendChild(r);
      });
      var spod = el('div', 'spod');
      if (stranky[z.id]) {
        var a = el('a', '', T.stranka + ' →');
        a.href = '/zapas.html?z=' + encodeURIComponent(stranky[z.id]);
        a.onclick = function (e) { e.stopPropagation(); };
        spod.appendChild(a);
      }
      // Rozehraný zápas jde smazat — bývá to omyl nebo zkouška. Dohraný ne:
      // to je výsledek, který už někdo mohl vidět (Roman 12. 11. 2026).
      if (!z.dohrano) {
        var smaz = el('button', 'zavrit', T.smazat);
        smaz.onclick = async function (e) {
          e.stopPropagation();
          if (!confirm(T.smazatOtazka)) return;
          smaz.disabled = true;
          if (await smazZapas(z.id)) {
            zapasy = zapasy.filter(function (x) { return x.id !== z.id; });
            k.remove();
          } else {
            smaz.disabled = false;
            alert(T.smazatChyba);
          }
        };
        spod.appendChild(smaz);
      }
      k.appendChild(spod);
      var detail = null;
      k.onclick = async function () {
        if (detail) return;
        detail = await podrobnosti(z.zaznam, Date.parse(z.zalozen));
        if (!detail) return;
        k.classList.add('otevrena');
        var zavri = el('button', 'zavrit', T.zavrit + ' ×');
        zavri.onclick = function (e) { e.stopPropagation(); detail.remove(); detail = null; zavri.remove(); k.classList.remove('otevrena'); };
        spod.appendChild(zavri);
        k.appendChild(detail);
        k.scrollIntoView({ block: 'start', behavior: 'smooth' });
      };
      return k;
    }
    kresliFiltr();
    kresliKarty();
  }

  // Podrobnosti jako v aplikaci: Průběh, Statistiky, Hráči a Fotostudio.
  // Počítá tentýž engine z uložené zálohy zápasu (app/detail.js).
  var jadro = null, detailModul = null;
  async function podrobnosti(zaznam, kdy) {
    if (!jadro) jadro = (await import('./app/jadro/skoretap-jadro.mjs')).Jadro.getInstance();
    if (!detailModul) detailModul = await import('./app/detail.js');
    if (!jadro.obnov(zaznam || '')) return null;
    var o = el('div', 'detail');
    detailModul.vykresliDetail(o, jadro, { en: en, jazyk: jaz, slovnik: slovnik, kdy: kdy, bezTabule: true });
    return o;
  }

  nacti();
</script>
</body>
</html>

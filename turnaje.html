<!doctype html>

<title>Turnaje — Skoretap</title>
<link rel="icon" href="/app/ikona-192.png">
<!--
  Turnaje pro kluby a pořadatele (rozhodnuti/058, krok 2).
  Turnaj založí kdokoli s účtem Skoretap. Los, pořadí a postup počítá mozek
  turnajů (app/turnaje/) tady v prohlížeči; server (migrace 018, 020) uloží
  nastavení a vede zápasy s kódy jako u federace — zapisovatel na kurtu je
  převezme v aplikaci (QR na kurtu, turnaj na celý den) a výsledky se sem
  vrací samy. Výsledek jde zapsat i ručně. Všechno se kreslí jako text.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --pozadi: #14141A; --karta: rgba(255,255,255,.07); --text: #FFFFFF; --tlumeny: rgba(255,255,255,.62); --micek: #C8F000; --cara: rgba(255,255,255,.12); --cervena: #FF3B2F; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--pozadi); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 18px 16px 48px; }
  a { color: var(--micek); }
  .znacka { color: var(--micek); font-weight: 800; letter-spacing: .08em; font-size: 14px; text-decoration: none; }
  h1 { font-size: 28px; margin: 18px 0 6px; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--tlumeny); margin: 28px 0 10px; }
  h3 { font-size: 16px; margin: 18px 0 8px; }
  p, .pozn { color: var(--tlumeny); }
  .pozn { font-size: 14px; }
  .hlavni { display: inline-block; border: 0; border-radius: 14px; padding: 12px 18px; background: var(--micek); color: #14141A; font: inherit; font-weight: 800; cursor: pointer; text-decoration: none; }
  .hlavni:disabled { opacity: .4; cursor: default; }
  .tlacitko { border: 1px solid var(--cara); background: transparent; color: var(--text); border-radius: 10px; padding: 7px 11px; font: inherit; font-size: 14px; cursor: pointer; }
  .karta { background: var(--karta); border-radius: 16px; padding: 16px; margin: 12px 0; }
  input, select, textarea { font: inherit; background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--cara); border-radius: 10px; padding: 9px 11px; }
  select option { background: #222; }
  textarea { width: 100%; min-height: 160px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--tlumeny); flex: 1 1 180px; }
  .radek { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin: 10px 0; }
  details { margin: 18px 0; } summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
  details .radek { align-items: center; margin: 6px 0; }
  .omezeni-nazev { min-width: 170px; }
  .chyba { color: var(--cervena); }
  .ok { color: var(--micek); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--cara); vertical-align: middle; }
  th { color: var(--tlumeny); font-weight: 600; }
  .tabulka { width: 100%; overflow-x: auto; }
  .vysl input { width: 54px; padding: 6px; }
  .vysl input.sety { width: 120px; }
  .bezi { color: var(--micek); font-weight: 800; }
  .kod { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
  .qr-mrizka { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .qr-karta { background: #fff; color: #14141A; border-radius: 14px; padding: 16px; text-align: center; }
  .qr-karta .kurt { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .qr-karta .qr { display: inline-block; }
  .qr-karta p { color: #14141A; font-size: 13px; margin: 8px 0 0; }
  @media print {
    body { background: #fff; }
    main > *:not(#tisk) { display: none !important; }
    #tisk { display: block !important; }
    .qr-karta { break-inside: avoid; border: 1px solid #ccc; }
  }
</style>

      return /P3M$/.test(cz) ? X.o3zapas : X.pavouk;

    function jmenaTymu(x) { return (x || []).map(function (h) { return h.jmeno || h.cislo || ''; }).join(' / '); }

    function textKolize(k, puvodni) {
      var cas = hhmm(k.od) + '–' + hhmm(k.do);
      var hraci = (k.hraci || []).map(function (h) { return puvodni[h] || h; }).join(', ');
      if (k.typ === 'kurt') return X.kKurt.replace('{k}', k.kurt).replace('{cas}', cas);
      if (k.typ === 'hrac') return X.kHrac.replace('{h}', hraci).replace('{cas}', cas);
      if (k.typ === 'zavreno') return X.kZavreno.replace('{k}', k.kurt).replace('{cas}', cas);
      if (k.typ === 'prani') return X.kPrani.replace('{h}', hraci).replace('{cas}', cas);
      return X.kPauza.replace('{h}', hraci).replace('{m}', Math.max(0, Math.round((k.do - k.od) / 60000))).replace('{p}', n.prestavkaMin || 0);
    }

    // O kolik minut se nezačatý zápas posunul proti plánu pořadatele (0 = neposunul).
    function posunutoMin(z) {
      if (z.stav !== 'planovany' || !z.kdy || !z.kdy_plan) return 0;
      return Math.round((Date.parse(z.kdy) - Date.parse(z.kdy_plan)) / 60000);
    }

    // Úpravy nanečisto (058, mřížka část 4): změny se drží jen v této stránce
    // (a v prohlížeči, přežijí obnovení), hráči nic nevidí, dokud je
    // pořadatel nezveřejní — pak jdou na server najednou a s jedním oznámením.
    function klicNavrhu() { return 'navrh.' + org + '.' + cislo; }
    function klicNanecisto() { return 'nanecisto.' + org + '.' + cislo; }
    function nactiNavrh() { try { return JSON.parse(cteni(klicNavrhu()) || '{}') || {}; } catch (e) { return {}; } }
    function ulozNavrh(x) { zapis(klicNavrhu(), JSON.stringify(x)); }
    function omezeni() { return { kurty: n.kurtyHodiny || {}, prani: n.prani || {} }; }

    function kresliMrizkuRozpisu() {
      var ted = Date.now();
      var nanecisto = cteni(klicNanecisto()) === '1';
      var navrh = nanecisto ? nactiNavrh() : {};
      var sN = M.sNavrhem(zapasy, navrh);
      if (sN.neplatne.length) { sN.neplatne.forEach(function (c) { delete navrh[c]; }); ulozNavrh(navrh); }
      var zz = sN.zapasy, pocetZmen = Object.keys(navrh).length;
      var puvodni = {};
      zz.forEach(function (z) { (z.tym_a || []).concat(z.tym_b || []).forEach(function (h) { var j = h.jmeno || h.cislo || ''; puvodni[j.trim().toLowerCase()] = j.trim(); }); });
      var chyby = M.kolize(zz, n.delkaMin, n.prestavkaMin || 0, ted, omezeni());
      var chybne = new Set(); chyby.forEach(function (k) { chybne.add(k.a); chybne.add(k.b); });
      var podle = new Map(zz.map(function (z) { return [z.cislo, z]; }));
      var lze = !t.zruseno;
      var vyb = vybrany && podle.get(vybrany);
      if (vyb && !M.lzePresunout(vyb)) { vybrany = null; vyb = null; }

      // Nanečisto, nebo rovnou
      if (lze) {
        var rn = el('div', 'radek');
        if (!nanecisto) {
          rn.appendChild(el('p', 'pozn', X.rovnouPopis));
          rn.appendChild(tlac(X.zacitNanecisto, 'tlacitko', function () { zapis(klicNanecisto(), '1'); kresli(); }));
        } else {
          rn.appendChild(el('p', 'ok', X.nanecistoPopis.replace('{n}', pocetZmen)));
          var tz = tlac(X.zverejnitZmeny.replace('{n}', pocetZmen), 'hlavni', async function () {
            tz.disabled = true;
            var zmeny = Object.keys(navrh).map(function (c) { var x = navrh[c]; var o = { cislo: c, kurt: x.kurt, kdy: x.kdy }; if (x.delka != null) o.delka = x.delka; return o; });
            try {
              var v = await rpc('fedw_rozpis_zverejni', { p_federace: org, p_cislo: cislo, p_zmeny: zmeny });
              ulozNavrh({});
              hlaskaMrizky = (v && v.neprovedeno && v.neprovedeno.length) ? X.neprovedeno.replace('{n}', v.neprovedeno.length) : '';
              infoMrizky = !v ? '' : v.zapnuto ? X.emailyPoslany.replace('{e}', v.emailu || 0) + (v.bez_uctu ? ' ' + X.bezUctu.replace('{b}', v.bez_uctu) : '') : X.jenStranka;
              zapis(klicNanecisto(), '0');
            } catch (e) { hlaskaMrizky = X.chyba; tz.disabled = false; }
            nacti();
          });
          tz.disabled = !pocetZmen; rn.appendChild(tz);
          rn.appendChild(tlac(pocetZmen ? X.zahoditZmeny : X.konecNanecisto, 'tlacitko', function () {
            if (pocetZmen && !confirm(X.zahoditOtazka)) return;
            ulozNavrh({}); zapis(klicNanecisto(), '0'); kresli();
          }));
        }
        telo.appendChild(rn);
      }

      var info = el('div', 'radek');
      info.appendChild(el('p', vyb ? 'ok' : 'pozn', vyb ? X.mzVybrano.replace('{z}', jmenaTymu(vyb.tym_a) + ' — ' + jmenaTymu(vyb.tym_b)) : X.mzNavod));
      if (vyb && !nanecisto) info.appendChild(tlac(vyb.pevny_cas ? X.uvolnitCas : X.pevnyCas, 'tlacitko', async function () {
        var cz = vyb.cislo, pevny = !vyb.pevny_cas;
        vybrany = null;
        try { if (!(await rpc('fedw_zapas_pevny', { p_federace: org, p_cislo: cz, p_pevny: pevny }))) hlaskaMrizky = X.nepresunuto; }
        catch (e) { hlaskaMrizky = X.chyba; }
        nacti();
      }));
      if (vyb && navrh[vyb.cislo]) info.appendChild(tlac(X.vratitZmenu, 'tlacitko', function () { delete navrh[vyb.cislo]; ulozNavrh(navrh); vybrany = null; kresli(); }));
      if (vyb) info.appendChild(tlac(X.mzZrusit, 'tlacitko', function () { vybrany = null; kresli(); }));
      if (lze) telo.appendChild(info);
      var zprava = el('p', 'chyba');
      var kam = el('div'); telo.appendChild(kam);
      kresliMrizku(kam, {
        zapasy: zz, kurty: n.kurty, delkaMin: n.delkaMin, ted: ted, en: en, X: X.mz, hodiny: n.kurtyHodiny,
        chybne: chybne, vybrany: vybrany, prestavkaMin: n.prestavkaMin || 0,
        popis: function (z) {
          var w = M.okno(z, n.delkaMin, ted);
          var sk = z.stav === 'planovany' ? '' : ' · ' + skoreTextem(z);
          var o = z.nanecisto ? 0 : posunutoMin(z);
          var zn = z.nanecisto ? ' · ' + X.nanecistoZnacka : z.pevny_cas ? ' · ' + X.pevnyZnacka : (o ? ' · ' + (o > 0 ? '+' : '') + o + ' min' : '');
          return { maly: (w ? hhmm(w.od) + '–' + hhmm(w.do) + ' · ' : '') + faze(z.cislo) + zn + sk, a: jmenaTymu(z.tym_a), b: jmenaTymu(z.tym_b) };
        },
        naZapas: lze ? function (z) { vybrany = vybrany === z.cislo ? null : z.cislo; kresli(); } : null,
        naMisto: lze ? function (kurt, ms) { if (vybrany) presunZapas(vybrany, kurt, ms, null); } : null,
        naTah: lze ? function (z, kurt, ms, delka) { presunZapas(z.cislo, kurt, ms, delka); } : null
      });
      zprava.textContent = hlaskaMrizky || '';
      if (infoMrizky) { var inf = el('p', 'ok', infoMrizky); kam.parentNode.insertBefore(inf, kam); infoMrizky = ''; }
      // Posun ťuknutím i tahem. Nanečisto jen do návrhu (kolize jsou vidět
      // v mřížce); rovnou se nejdřív zeptá, když by vznikla kolize.
      async function presunZapas(cz, kurt, ms, delka) {
        if (nanecisto) {
          var pred = navrh[cz] || {};
          navrh[cz] = { kurt: kurt, kdy: new Date(ms).toISOString() };
          var d0 = delka != null ? delka : pred.delka;
          if (d0 != null) navrh[cz].delka = d0;
          ulozNavrh(navrh); vybrany = null; kresli();
          return;
        }
        var po = M.presun(zapasy, cz, kurt, ms, delka);
        var nove = M.kolizeZapasu(M.kolize(po, n.delkaMin, n.prestavkaMin || 0, Date.now(), omezeni()), cz);
        if (nove.length && !confirm(X.poPresunu + '\n' + nove.map(function (k) { return '– ' + textKolize(k, puvodni); }).join('\n') + '\n\n' + X.presto)) return;
        // Nové místo je vidět hned; server ho potvrdí při načtení.
        zapasy = po; vybrany = null; hlaskaMrizky = ''; kresli();
        try {
          var arg = { p_federace: org, p_cislo: cz, p_kurt: kurt, p_kdy: new Date(ms).toISOString() };
          if (delka != null) arg.p_delka = delka;
          var ok = await rpc('fedw_zapas_presun', arg);
          if (!ok) hlaskaMrizky = X.nepresunuto;
        } catch (e) { hlaskaMrizky = X.chyba; }
        nacti();
      }
      var obal = kam.querySelector('.mz-obal');
      if (obal) {
        if (posunMrizky != null) obal.scrollLeft = posunMrizky;
        obal.addEventListener('scroll', function () { posunMrizky = obal.scrollLeft; });
      }
      telo.appendChild(zprava);
      telo.appendChild(el('h3', '', X.chybyRozpisu));
      if (!chyby.length) telo.appendChild(el('p', 'pozn', X.bezChyb));
      chyby.forEach(function (k) { telo.appendChild(el('p', 'chyba', textKolize(k, puvodni))); });
      if (lze) kresliOmezeni(puvodni);
    }

    // Kdy je kurt volný a přání hráčů na časy — v den turnaje, hodiny:minuty.
    // Prázdné = bez omezení. Přání vidí jen pořadatel (z veřejné stránky se odstraní).
    function kresliOmezeni(puvodni) {
      var det = el('details'); telo.appendChild(det);
      if (otevrenoOmezeni) det.open = true;
      det.addEventListener('toggle', function () { otevrenoOmezeni = det.open; });
      det.appendChild(el('summary', '', X.omezeniNadpis));
      det.appendChild(el('p', 'pozn', X.omezeniPopis));
      var den = n.zacatek ? new Date(n.zacatek) : new Date();
      var denText = den.getFullYear() + '-' + String(den.getMonth() + 1).padStart(2, '0') + '-' + String(den.getDate()).padStart(2, '0');
      var naIso = function (v) { return v ? new Date(denText + 'T' + v).toISOString() : null; };
      var zIso = function (iso) { if (!iso) return ''; var d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
      var pole = [];
      var radek = function (nazev, druh, klic, hod) {
        var r = el('div', 'radek');
        r.appendChild(el('span', 'omezeni-nazev', nazev));
        var od = el('input'); od.type = 'time'; od.value = zIso(hod && hod.od); od.setAttribute('aria-label', nazev + ' ' + X.od);
        var dO = el('input'); dO.type = 'time'; dO.value = zIso(hod && hod.do); dO.setAttribute('aria-label', nazev + ' ' + X.do_);
        r.appendChild(el('span', 'pozn', X.od)); r.appendChild(od); r.appendChild(el('span', 'pozn', X.do_)); r.appendChild(dO);
        det.appendChild(r);
        pole.push({ druh: druh, klic: klic, od: od, do: dO });
      };
      det.appendChild(el('h3', '', X.hodinyKurtu));
      Array.from(new Set((n.kurty || []).concat(zapasy.map(function (z) { return z.kurt; }).filter(Boolean)))).forEach(function (k) {
        radek(X.mz.kurt + ' ' + k, 'kurty', k, (n.kurtyHodiny || {})[k]);
      });
      det.appendChild(el('h3', '', X.praniHracu));
      Object.keys(puvodni).sort(function (a, b) { return puvodni[a].localeCompare(puvodni[b]); }).forEach(function (h) {
        radek(puvodni[h], 'prani', h, (n.prani || {})[h]);
      });
      var hl = el('p', 'chyba');
      det.appendChild(tlac(X.ulozitOmezeni, 'hlavni', async function () {
        otevrenoOmezeni = true;
        var kurtyHodiny = {}, prani = {};
        pole.forEach(function (p) {
          if (!p.od.value && !p.do.value) return;
          var x = {}; if (p.od.value) x.od = naIso(p.od.value); if (p.do.value) x.do = naIso(p.do.value);
          (p.druh === 'kurty' ? kurtyHodiny : prani)[p.klic] = x;
        });
        var stare = [n.kurtyHodiny, n.prani];
        n.kurtyHodiny = kurtyHodiny; n.prani = prani;
        try { await uloz(); } catch (e) { n.kurtyHodiny = stare[0]; n.prani = stare[1]; hl.textContent = X.chyba; return; }
        nacti();
      }));
      det.appendChild(hl);
    }

    function skoreTextem(z) {
      var s = z.skore || {};
      if (Array.isArray(s.body) && !s.sety) return s.body[0] + ':' + s.body[1];
      return (s.sety || []).map(function (x) { return x[0] + ':' + x[1]; }).join(' ');

    function kresliAkce() {

    // Veřejné výsledky (058, krok 4): stránka, televize v areálu, okénko na web.

    // Přihlášky (058, krok 3): odkaz pro hráče, nastavení, seznam, los z přihlášených.
    function kresliPrihlasky() {

      k.appendChild(el('p', prihl.otevreno ? 'ok' : 'pozn', prihl.otevreno ? X.prihlaskyOtevrene : X.prihlaskyZavrene));

      // Seznam

        tr.appendChild(el('td', '', String(i + 1)));
        var tdj = el('td', '', p.partner ? p.jmeno + ' / ' + p.partner : p.jmeno);
        if (p.muze_od || p.muze_do) tdj.appendChild(el('div', 'pozn', X.muze + ' ' + (p.muze_od ? hhmm(p.muze_od) : '…') + '–' + (p.muze_do ? hhmm(p.muze_do) : '…')));
        tr.appendChild(tdj);
        tr.appendChild(el('td', p.stav === 'nahradnik' ? 'pozn' : '', p.stav === 'nahradnik' ? X.nahradnik : (p.rucne ? X.rucne : '')));
        if (prihl.startovne) {
          // VS = číslo přihlášky; zaplaceno označí pořadatel, až peníze dorazí.
          var tdp = el('td');
          tdp.appendChild(el('div', 'pozn', 'VS ' + p.vs));
          tdp.appendChild(tlac(p.zaplaceno ? X.zaplaceno : X.nezaplaceno, p.zaplaceno ? 'hlavni' : 'tlacitko', async function () {
            await rpc('fedw_zaplaceno', { p_federace: org, p_id: p.id, p_ano: !p.zaplaceno }).catch(function () {}); nacti();
          }));
          tr.appendChild(tdp);
        }
        var ak = el('td');
        if (p.stav === 'nahradnik') ak.appendChild(tlac(X.posunout, 'tlacitko', async function () { await rpc('fedw_prihlaska_stav', { p_federace: org, p_id: p.id, p_stav: 'prihlasen' }).catch(function () {}); nacti(); }));
        ak.appendChild(tlac(X.odebrat, 'tlacitko', async function () { await rpc('fedw_prihlaska_stav', { p_federace: org, p_id: p.id, p_stav: 'odhlasen' }).catch(function () {}); nacti(); }));
        tr.appendChild(ak);
        tb.appendChild(tr);
      });
      var obal = el('div', 'tabulka'); obal.appendChild(tb); telo.appendChild(obal);
      // Ruční přidání (hráč bez účtu)
      var r3 = el('div', 'radek');
      var j1 = vstup('text', ''); j1.placeholder = T.jePoHracich(n) ? X.jmenoHrace : X.hrac1;
      r3.appendChild(j1);
      var j2 = vstup('text', ''); j2.placeholder = X.hrac2;
      if (!T.jePoHracich(n)) r3.appendChild(j2);
      r3.appendChild(tlac(X.pridat, 'tlacitko', async function () {
        if (!j1.value.trim()) return;
        await rpc('fedw_prihlaska_pridej', { p_federace: org, p_cislo: cislo, p_jmeno: j1.value.trim(), p_partner: j2.value.trim() }).catch(function () {});
        nacti();
      }));
      telo.appendChild(r3);
      // Los z přihlášených
      var zprava = el('p', 'chyba');
      telo.appendChild(tlac(X.vylosovatPrihlasene, 'hlavni', async function () {
        if (T.jePoHracich(n)) n.hraci = prihlaseni.map(function (p) { return p.jmeno; });
        else n.tymy = prihlaseni.map(function (p) { return [p.jmeno, p.partner].filter(Boolean); });
        if (n.format === 'skupiny' && n.tymy) { n.skupin = n.skupin || T.doporucenoSkupin(n.tymy.length); n.postupuje = n.postupuje || 2; }
        // „Kdy můžu hrát" z přihlášek jde do přání v mřížce (059 → 058, část 4).
        prihlaseni.forEach(function (p) {
          if (!p.muze_od && !p.muze_do) return;
          n.prani = n.prani || {};
          [p.jmeno, p.partner].filter(Boolean).forEach(function (j) { var x = {}; if (p.muze_od) x.od = p.muze_od; if (p.muze_do) x.do = p.muze_do; n.prani[j.trim().toLowerCase()] = x; });
        });
        var spatna = !T.jePoHracich(n) && n.tymy.find(function (x) { return x.length !== 2; });
        var c = spatna ? X.ch.dvojice.replace('{r}', spatna.join(' / ')) : (T.chybaNastaveni(n) ? X.ch[T.chybaNastaveni(n)] : null);
        if (c) { zprava.textContent = c; delete n.hraci; delete n.tymy; return; }
        try {
          n.kola = T.prvniLos(n);
          await uloz();
          await rpc('fedw_prihlasky_nastav', { p_federace: org, p_cislo: cislo, p_otevreno: false, p_kapacita: prihl.kapacita, p_uzaverka: prihl.uzaverka });
          await rpc('fedw_nahraj', { p_federace: org, p_turnaj: { cislo: cislo, nazev: t.nazev, misto: t.misto }, p_zapasy: T.zapasyKol(n, cislo) });
          nacti();
        } catch (e) { n.kola = []; zprava.textContent = X.chyba + ' (' + e.message + ')'; }
      }));
      telo.appendChild(zprava);
    }

    function nazevKolaPavouka(k, kol) {
      var od = kol - k;
      return od === 1 ? X.finale : od === 2 ? X.semifinale : od === 3 ? X.ctvrtfinale : X.kolo_p.replace('{k}', k + 1);
    }
    function kresliPavouk() {
      var m = new Map(zapasy.map(function (z) { return [z.cislo, z]; }));
      var playoffy = T.stavPlayoffu(n, cislo, zapasy);
      playoffy.forEach(function (p) {
        // Pásma mají nadpis podle umístění, o které se hraje.
        telo.appendChild(el('h2', '', playoffy.length > 1 ? X.pasmo.replace('{od}', p.od).replace('{do}', p.od + 3) : X.pavouk));
        p.kola.forEach(function (kolo, k) {
          telo.appendChild(el('h3', '', nazevKolaPavouka(k, p.kola.length)));
          var tb = el('table');
          kolo.forEach(function (z, i) {
            if (z.volny) return;
            var cz = p.predpona + (k + 1) + '-' + (i + 1);
            tb.appendChild(radekZapasu(m.get(cz), cz, z.a ? T.jmeno(n, z.a) : '…', z.b ? T.jmeno(n, z.b) : '…'));
          });
          var obal = el('div', 'tabulka'); obal.appendChild(tb); telo.appendChild(obal);
        });
        if (p.o3zapas) {
          telo.appendChild(el('h3', '', X.o3zapas));
          var tb3 = el('table');
          tb3.appendChild(radekZapasu(m.get(p.o3zapas.cislo), p.o3zapas.cislo, p.o3zapas.a ? T.jmeno(n, p.o3zapas.a) : '…', p.o3zapas.b ? T.jmeno(n, p.o3zapas.b) : '…'));
          telo.appendChild(tb3);
        }
        p.mista.forEach(function (id, i) { telo.appendChild(el('p', i === 0 ? 'ok' : 'pozn', (p.od + i) + '. ' + T.jmeno(n, id))); });
      });
    }

    function kresliKola() {
      var m = new Map(zapasy.map(function (z) { return [z.cislo, z]; }));
      n.kola.forEach(function (kolo, k) {
        telo.appendChild(el('h2', '', X.kolo.replace('{k}', k + 1)));
        var tb = el('table'); var h = el('tr');
        [X.kurt, X.cas, X.hraje, '', X.vysledek].forEach(function (x) { h.appendChild(el('th', '', x)); }); tb.appendChild(h);
        kolo.zapasy.forEach(function (z, i) {
          var cz = cislo + '/K' + (k + 1) + '-' + (i + 1);
          var strana = function (x) { return (Array.isArray(x) ? x : [x]).map(function (id) { return T.jmeno(n, id); }).join(' / '); };
          tb.appendChild(radekZapasu(m.get(cz), cz, strana(z.a), strana(z.b)));
        });
        var obal = el('div', 'tabulka'); obal.appendChild(tb); telo.appendChild(obal);
        if (kolo.pauza && kolo.pauza.length) telo.appendChild(el('p', 'pozn', X.pauza + kolo.pauza.map(function (id) { return T.jmeno(n, id); }).join(', ')));
      });
    }

    // Řádek zápasu: kurt, čas, hráči, stav a výsledek; ruční zápis výsledku.
    function radekZapasu(z, cz, a, b) {
      var tr = el('tr');
      tr.appendChild(el('td', '', z ? z.kurt : ''));
      tr.appendChild(el('td', '', z && z.kdy ? hhmm(Date.parse(z.kdy)) : ''));
      var hr = el('td'); hr.appendChild(el('div', '', a)); hr.appendChild(el('div', '', b)); tr.appendChild(hr);
      tr.appendChild(el('td', z && z.stav === 'bezi' ? 'bezi' : 'pozn', z ? (X[z.stav] || X.zruseny_z) : ''));
      var td = el('td', 'vysl');
      if (z && z.stav !== 'zruseny' && !t.zruseno) {
        var body = n.pocitani && n.pocitani.typ === 'body';
        var s = z.skore || {};
        if (body) {
          var ia = vstup('number', Array.isArray(s.body) ? s.body[0] : ''), ib = vstup('number', Array.isArray(s.body) ? s.body[1] : '');
          td.appendChild(ia); td.appendChild(document.createTextNode(' : ')); td.appendChild(ib);
          td.appendChild(tlac(X.ulozit, 'tlacitko', function () {
            if (ia.value === '' || ib.value === '') return;
            zapisVysledek(cz, { body: [Number(ia.value), Number(ib.value)] });
          }));
        } else {
          var is = vstup('text', (s.sety || []).map(function (x) { return x[0] + ':' + x[1]; }).join(' '));
          is.className = 'sety'; is.placeholder = X.setyNapoveda;
          td.appendChild(is);
          td.appendChild(tlac(X.ulozit, 'tlacitko', function () {
            var sety = is.value.trim().split(/\s+/).map(function (x) { var m = /^(\d+)[:\-](\d+)$/.exec(x); return m ? [Number(m[1]), Number(m[2])] : null; });
            if (!sety.length || sety.some(function (x) { return !x; })) { is.style.borderColor = 'var(--cervena)'; return; }
            zapisVysledek(cz, { sety: sety });
          }));
        }
      }
      tr.appendChild(td);
      return tr;
    }

    async function zapisVysledek(cz, skore) {
      try { await rpc('fedw_vysledek', { p_federace: org, p_cislo: cz, p_skore: skore, p_duvod: null }); } catch (e) { alert(X.chyba); }
      nacti();
    }

    // QR na kurty a na recepci (jako stránka pro federace).
    function tiskQr() {
      var tisk = document.getElementById('tisk'); tisk.textContent = '';
      var mriz = el('div', 'qr-mrizka'); tisk.appendChild(mriz);
      function karta(nadpis, text, odkaz, popis) {
        var k = el('div', 'qr-karta');
        k.appendChild(el('div', '', t.nazev || cislo));
        k.appendChild(el('div', 'kurt', nadpis));
        var q = el('div', 'qr'); k.appendChild(q);
        new QRCode(q, { text: odkaz, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
        if (text) k.appendChild(el('p', '', text));
        k.appendChild(el('p', '', popis));
        mriz.appendChild(k);
      }
      karta(X.recepce, X.kodTurnaje + ': ' + t.kod, 'https://skoretap.com/f.html?t=' + t.kod, X.recepcePopis);
      n.kurty.forEach(function (k) {
        karta(X.kurt + ' ' + k, '', 'https://skoretap.com/f.html?t=' + t.kod + '&k=' + encodeURIComponent(k), X.qrPopis);
      });
      tisk.hidden = false;
      setTimeout(function () { window.print(); tisk.hidden = true; }, 300);
    }

    await nacti();
    // Během tahu v mřížce se neobnovuje — překreslení by tah utrhlo.
    obnova = setInterval(function () { if (!document.body.classList.contains('mz-tazeni')) nacti(); }, 10000);
  }

  start();
</script>

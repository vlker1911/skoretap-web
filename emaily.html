<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>E-maily — Skoretap</title>
<link rel="icon" href="/app/ikona-192.png">
<!--
  Odkaz „tyhle e-maily nechci“ z e-mailu o změně rozpisu turnaje:
  skoretap.com/emaily.html?t=<token> (rozhodnuti/059). Bez přihlášení,
  token je jen v e-mailu. Vypíná se až ťuknutím na tlačítko, ne samotným
  otevřením — některé poštovní programy odkazy předem otevírají.
  Funkce ucet_emaily_vypnout (migrace 028).
-->
<style>
  :root { --pozadi: #14141A; --karta: rgba(255,255,255,.07); --text: #FFFFFF; --tlumeny: rgba(255,255,255,.62); --micek: #C8F000; --cara: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--pozadi); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 56px; }
  a { color: var(--micek); }
  .znacka { color: var(--micek); font-weight: 800; letter-spacing: .08em; font-size: 14px; text-decoration: none; }
  h1 { font-size: 26px; margin: 14px 0 8px; }
  p { color: var(--tlumeny); }
  button { font: inherit; font-weight: 800; border: 0; border-radius: 999px; padding: 12px 22px; background: var(--micek); color: #14141A; cursor: pointer; }
  button:disabled { opacity: .5; }
  .ok { color: var(--micek); font-weight: 700; }
</style>
</head>
<body>
<main>
  <a class="znacka" href="/">SKORETAP</a>
  <h1 id="nadpis"></h1>
  <p id="popis"></p>
  <button type="button" id="tlacitko"></button>
  <p id="vysledek"></p>
</main>
<script type="module">
  import { SERVER, KLIC } from './app/ucet.js';
  var en = !/^cs|^sk/.test((navigator.language || 'cs').toLowerCase());
  document.documentElement.lang = en ? 'en' : 'cs';
  var X = en ? {
    nadpis: 'Emails about tournaments', popis: 'Turn off emails about schedule changes in tournaments you entered. You can turn them back on in your account on skoretap.com.',
    tlacitko: 'Turn off emails', hotovo: 'Done — you will not get these emails any more.', spatny: 'This link is not valid. You can turn emails off in your account on skoretap.com.', chyba: 'Something went wrong. Try again.', ucet: 'My account'
  } : {
    nadpis: 'E-maily o turnajích', popis: 'Vypni e-maily o změnách rozpisu v turnajích, do kterých jsi přihlášený. Zapnout je můžeš zase v účtu na skoretap.com.',
    tlacitko: 'Vypnout e-maily', hotovo: 'Hotovo — tyhle e-maily už nedostaneš.', spatny: 'Tenhle odkaz neplatí. E-maily můžeš vypnout v účtu na skoretap.com.', chyba: 'Něco se nepovedlo. Zkus to znovu.', ucet: 'Můj účet'
  };
  document.title = X.nadpis + ' — Skoretap';
  document.getElementById('nadpis').textContent = X.nadpis;
  document.getElementById('popis').textContent = X.popis;
  var tl = document.getElementById('tlacitko'), vysledek = document.getElementById('vysledek');
  tl.textContent = X.tlacitko;
  var token = new URLSearchParams(location.search).get('t') || '';
  if (!/^[0-9a-f-]{36}$/i.test(token)) { tl.hidden = true; vysledek.textContent = X.spatny; }
  tl.onclick = async function () {
    tl.disabled = true; vysledek.textContent = '';
    try {
      var odp = await fetch(SERVER + '/rest/v1/rpc/ucet_emaily_vypnout', {
        method: 'POST', headers: { apikey: KLIC, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: token })
      });
      if (!odp.ok) throw new Error(String(odp.status));
      var ok = await odp.json();
      tl.hidden = true;
      vysledek.className = ok ? 'ok' : '';
      vysledek.textContent = ok ? X.hotovo : X.spatny;
    } catch (e) { vysledek.textContent = X.chyba; tl.disabled = false; }
  };
</script>
</body>
</html>
